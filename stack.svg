<svg width="600" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap');
      .titulo { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 18px; fill: #E5E7EB; }
      .pill { fill: transparent; stroke: #374151; stroke-width: 1px; rx: 14px; }
      .ptext { font-family: 'Inter', sans-serif; font-size: 12px; fill: #E5E7EB; font-weight: 600;}
      .neon { stroke: #a855f7; filter: drop-shadow(0 0 3px rgba(168,85,247,0.5)); }
    </style>
  </defs>
  <text x="0" y="20" class="titulo">Mi stack tecnológico</text>

  <!-- Fila 1 -->
  <!-- Laravel -->
  <g transform="translate(0, 40)">
    <rect class="pill" width="90" height="28" stroke="#ef4444"/>
    <text x="10" y="19" font-size="14">🔥</text><text x="30" y="19" class="ptext">Laravel</text>
  </g>
  <!-- PHP -->
  <g transform="translate(100, 40)">
    <rect class="pill" width="80" height="28" stroke="#8b5cf6"/>
    <text x="10" y="19" font-size="14">🐘</text><text x="30" y="19" class="ptext">PHP</text>
  </g>
  <!-- C# -->
  <g transform="translate(190, 40)">
    <rect class="pill neon" width="70" height="28"/>
    <text x="10" y="19" font-size="14">🟣</text><text x="30" y="19" class="ptext">C#</text>
  </g>
  <!-- .NET -->
  <g transform="translate(270, 40)">
    <rect class="pill" width="80" height="28" stroke="#8b5cf6"/>
    <text x="10" y="19" font-size="14">🌐</text><text x="30" y="19" class="ptext">.NET</text>
  </g>
  <!-- Java -->
  <g transform="translate(360, 40)">
    <rect class="pill" width="80" height="28" stroke="#f59e0b"/>
    <text x="10" y="19" font-size="14">☕</text><text x="30" y="19" class="ptext">Java</text>
  </g>
  <!-- MySQL -->
  <g transform="translate(450, 40)">
    <rect class="pill" width="90" height="28" stroke="#3b82f6"/>
    <text x="10" y="19" font-size="14">🐬</text><text x="30" y="19" class="ptext">MySQL</text>
  </g>

  <!-- Fila 2 -->
  <!-- Git -->
  <g transform="translate(0, 80)">
    <rect class="pill" width="70" height="28" stroke="#f97316"/>
    <text x="10" y="19" font-size="14">🦑</text><text x="30" y="19" class="ptext">Git</text>
  </g>
  <!-- Docker -->
  <g transform="translate(80, 80)">
    <rect class="pill" width="90" height="28" stroke="#3b82f6"/>
    <text x="10" y="19" font-size="14">🐳</text><text x="30" y="19" class="ptext">Docker</text>
  </g>
  <!-- Azure -->
  <g transform="translate(180, 80)">
    <rect class="pill" width="85" height="28" stroke="#0ea5e9"/>
    <text x="10" y="19" font-size="14">☁️</text><text x="30" y="19" class="ptext">Azure</text>
  </g>
  <!-- VS Code -->
  <g transform="translate(275, 80)">
    <rect class="pill" width="100" height="28" stroke="#2563eb"/>
    <text x="10" y="19" font-size="14">💻</text><text x="30" y="19" class="ptext">VS Code</text>
  </g>
  <!-- Linux -->
  <g transform="translate(385, 80)">
    <rect class="pill" width="85" height="28" stroke="#fbbf24"/>
    <text x="10" y="19" font-size="14">🐧</text><text x="30" y="19" class="ptext">Linux</text>
  </g>
</svg>
