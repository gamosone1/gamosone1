<svg width="550" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&amp;display=swap');
      .titulo { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 18px; fill: #E5E7EB; }
      .stitle { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; fill: #E5E7EB; }
      .sdesc { font-family: 'Inter', sans-serif; font-size: 11px; fill: #9CA3AF; }
      .line { stroke: #1F2937; stroke-width: 2; }
      .punto { fill: #39FF14; filter: drop-shadow(0px 0px 3px rgba(57,255,20,0.8)); }
      .neon-text { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 16px; text-anchor: middle;}
    </style>
  </defs>
  <text x="0" y="20" font-size="20">🛣️</text>
  <text x="30" y="18" class="titulo">Mi camino</text>
  
  <!-- Linea del timeline -->
  <line x1="30" y1="65" x2="520" y2="65" class="line" />
  
  <!-- Puntos del timeline -->
  <circle cx="30" cy="65" r="4" class="punto" />
  <circle cx="170" cy="65" r="4" class="punto" />
  <circle cx="310" cy="65" r="4" class="punto" />
  <circle cx="450" cy="65" r="4" class="punto" />

  <!-- Textos del timeline -->
  <text x="30" y="50" font-size="16">🎓</text>
  <text x="30" y="85" class="stitle">Estudiante</text>
  <text x="30" y="100" class="sdesc">Cibertec</text>

  <text x="170" y="50" font-size="16">💼</text>
  <text x="170" y="85" class="stitle">Prácticas</text>
  <text x="170" y="100" class="sdesc">Municipalidad</text>

  <text x="310" y="50" font-size="16">🎯</text>
  <text x="310" y="85" class="stitle">Enfoque actual</text>
  <text x="310" y="100" class="sdesc">Laravel + SystemLab</text>

  <text x="450" y="50" font-size="16">🚀</text>
  <text x="450" y="85" class="stitle">Metas</text>
  <text x="450" y="100" class="sdesc">Mi propia empresa</text>

  <!-- SUEÑA > APRENDE > DESARROLLA > LOGRA -->
  <text x="275" y="160" class="neon-text">
    <tspan fill="#39FF14">SUEÑA</tspan>
    <tspan fill="#6B7280"> &gt; </tspan>
    <tspan fill="#39FF14">APRENDE</tspan>
    <tspan fill="#6B7280"> &gt; </tspan>
    <tspan fill="#A855F7">DESARROLLA</tspan>
    <tspan fill="#6B7280"> &gt; </tspan>
    <tspan fill="#39FF14">LOGRA</tspan>
  </text>
</svg>
