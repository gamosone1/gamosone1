      .card-bg { fill: #0A0F16; stroke: #1F2937; stroke-width: 1.5px; rx: 12px; }
      .seccion-titulo { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 15.5px; fill: #E5E7EB; }
