<svg viewBox="0 0 850 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#0D1117" />
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;display=swap');
      .bg { fill: #0A0F16; }
      
      /* Grid background */
      .grid { stroke: rgba(57, 255, 20, 0.07); stroke-width: 1; }
      
      .name { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 18px; fill: #9CA3AF; text-anchor: middle; letter-spacing: 4px;}
      
      .neon-title { 
        font-family: 'Inter', sans-serif; 
        font-weight: 900; 
        font-size: 65px; 
        fill: transparent; 
        stroke: #39FF14; 
        stroke-width: 2px;
        filter: drop-shadow(0 0 10px rgba(57,255,20,0.6));
        text-anchor: middle;
        font-style: italic;
      }
      .neon-title-fill {
        font-family: 'Inter', sans-serif; 
        font-weight: 900; 
        font-size: 65px; 
        fill: #ffffff; 
        text-anchor: middle;
        font-style: italic;
      }
      
      .subtitle { 
        font-family: 'Inter', sans-serif; 
        font-weight: 800; 
        font-size: 14px; 
        fill: #A855F7; 
        letter-spacing: 6px;
        text-anchor: middle;
      }
      
      .link { 
        font-family: 'Inter', sans-serif; 
        font-weight: 700; 
        font-size: 16px; 
        fill: #39FF14; 
        text-anchor: end;
        filter: drop-shadow(0 0 3px rgba(57,255,20,0.4));
      }
    </style>
    
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" class="grid"/>
    </pattern>
  </defs>

  <rect width="850" height="200" class="bg" rx="16" stroke="#1F2937" stroke-width="2"/>
  <rect width="850" height="200" fill="url(#gridPattern)" rx="16" />

  <!-- Name -->
  <text x="425" y="55" class="name">GHERS GANDELMAN</text>
  
  <!-- Main Title -->
  <text x="425" y="125" class="neon-title">GAMOSONE1</text>
  <text x="425" y="125" class="neon-title-fill">GAMOSONE1</text>
  
  <!-- Subtitle -->
  <text x="425" y="160" class="subtitle">CODE / BUILD / IMPROVE / REPEAT</text>
  
  <!-- Link -->
  <text x="830" y="180" class="link">www.systemlab.com.pe</text>
</svg>
